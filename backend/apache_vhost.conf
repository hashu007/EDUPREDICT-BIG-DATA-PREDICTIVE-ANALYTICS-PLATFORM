# ==============================================================================
# EduPredict - Apache HTTP Server Virtual Host & Reverse Proxy Configuration
# ==============================================================================
# Role: Host and serve the user-facing web dashboard, manage SSL/HTTP traffic,
#       and reverse-proxy API requests to the Flask & MongoDB backend.
# Requires modules: mod_proxy, mod_proxy_http, mod_rewrite, mod_headers
# ==============================================================================

<VirtualHost *:80>
    ServerName edupredict.university.local
    ServerAdmin webmaster@university.edu
    DocumentRoot /var/www/edupredict/dist

    # Enable Logging
    ErrorLog ${APACHE_LOG_DIR}/edupredict_error.log
    CustomLog ${APACHE_LOG_DIR}/edupredict_access.log combined

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # 1. Reverse Proxy for Backend REST API (Flask running on port 5000)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # 2. Single Page Application (SPA) HTML5 History Routing
    <Directory /var/www/edupredict/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # If the requested file or directory does not exist, route to index.html
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
